version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: parsh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
    binary: parsh

archives:
  - name_template: "parsh-{{.Version}}-{{.Os}}-{{.Arch}}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: torreirow
    name: parsh

homebrew_casks:
  - name: parsh
    directory: Casks
    repository:
      owner: torreirow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: wouter@technative.eu
    homepage: "https://github.com/torreirow/parsh"
    description: "Interactive shell for the AWS SSM Parameter Store"
    license: "MIT"
    hooks:
      post:
        # Binaries are not notarized; strip quarantine so macOS lets them run
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/parsh"]
          end
